[project]
name = "fer-bias-reproduction"
version = "3.0.0"
description = "Unified offline metrics, Jupyter and CUDA training environment"
requires-python = ">=3.12,<3.13"
dependencies = [
 "torch==2.6.0", "torchvision==0.21.0", "numpy==1.26.4", "pandas==2.1.4",
 "scipy==1.12.0", "matplotlib==3.8.4", "seaborn==0.13.2", "scikit-learn==1.4.2",
 "jupyterlab==4.2.5", "nbclient==0.10.0", "nbconvert==7.16.4", "nbformat==5.10.4",
 "pillow==10.4.0", "pytest==8.3.3", "mistune==3.0.2", "ipykernel==6.29.5",
 "ipython==8.29.0", "jupyter-client==8.6.3", "tqdm==4.66.5", "gdown==5.2.0"
]
[tool.uv]
package = false
[[tool.uv.index]]
name = "pypi-tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
